[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sacred-gatekeeper-broker"
version = "0.1.0"
description = "Local auth broker for Sacred Gatekeeper"
dependencies = [
    "cryptography>=3.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"